name: CI
on: [push, pull_request]
jobs:
  theme-check:
    name: Theme Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Theme Check
        run: npx --yes @shopify/cli@3 theme check --fail-level error
